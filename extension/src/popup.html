<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 350px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      margin: 0;
    }
    h2 {
      margin: 0 0 15px 0;
      font-size: 18px;
      color: #333;
    }
    button {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      font-size: 14px;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      font-weight: 500;
      transition: all 0.2s;
    }
    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .start-btn {
      background: #10b981;
      color: white;
    }
    .start-btn:hover {
      background: #059669;
    }
    .stop-btn {
      background: #ef4444;
      color: white;
    }
    .stop-btn:hover {
      background: #dc2626;
    }
    .secondary-btn {
      background: #e5e7eb;
      color: #374151;
    }
    .secondary-btn:hover {
      background: #d1d5db;
    }
    #status {
      padding: 12px;
      margin: 12px 0;
      background: #f3f4f6;
      border-radius: 6px;
      font-size: 13px;
      color: #4b5563;
    }
    #status.recording {
      background: #fee2e2;
      color: #991b1b;
      border-left: 3px solid #ef4444;
    }
    .settings {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #e5e7eb;
    }
    .setting-row {
      margin: 10px 0;
      font-size: 13px;
    }
    label {
      display: flex;
      align-items: center;
      cursor: pointer;
    }
    input[type="checkbox"] {
      margin-right: 8px;
      cursor: pointer;
    }
    select {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      font-size: 13px;
    }
    .info {
      font-size: 12px;
      color: #6b7280;
      margin-top: 10px;
      line-height: 1.5;
    }
    .step-count {
      font-weight: 600;
      color: #10b981;
    }
  </style>
</head>
<body>
  <h2>📄 Demo2PDF Capture</h2>

  <div id="status">Not recording</div>

  <div id="stepCount" class="info" style="display:none;">
    Steps captured: <span class="step-count" id="count">0</span>
  </div>

  <button id="startBtn" class="start-btn">▶ Start Recording</button>
  <button id="stopBtn" class="stop-btn" style="display:none;">⬛ Stop Recording</button>
  <button id="viewBtn" class="secondary-btn" style="display:none;">📊 View Session</button>

  <div class="settings">
    <div class="setting-row">
      <label>
        <input type="checkbox" id="useLLM">
        <span>🤖 Use AI descriptions (requires API key)</span>
      </label>
    </div>

    <div class="setting-row" id="llmProviderRow" style="display:none;">
      <label>AI Provider:</label>
      <select id="llmProvider">
        <option value="openai">OpenAI (GPT-4o-mini)</option>
        <option value="anthropic">Anthropic (Claude)</option>
        <option value="ollama">Ollama (Local)</option>
      </select>
    </div>

    <div class="info">
      💡 Tip: Start without AI for fast capture, then upgrade descriptions later.
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
